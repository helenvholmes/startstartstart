<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>startstartstart! preview image</title>
<!--
  The source for the link preview image, ../og.png (1200×630). To regenerate it, serve
  this folder and screenshot this page at 1200×630 in dark mode with reduced motion,
  so the logo and sky hold still, for example with headless Chrome:
    --window-size=1200,630 --blink-settings=preferredColorScheme=0
    --force-prefers-reduced-motion --virtual-time-budget=3000
-->
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { position: relative; }
  .og { position: relative; box-sizing: border-box; height: 630px; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .og .mark .logo { height: 34px; margin-left: -17px; } /* the logo centres in a box sized for its widest pose */
  .og h1 { font-family: var(--serif); font-weight: 300; font-size: 84px; line-height: 1.04; letter-spacing: -.015em; margin: 0; max-width: 15ch; animation: none; }
  .og p { margin: 0; color: var(--muted); font-size: 26px; font-weight: 300; animation: none; }
  .og .url { color: var(--text); font-weight: 400; }
</style>
<script src="../sky.js" defer></script>
<script src="../logo.js" defer></script>
</head>
<body>
<canvas class="sky" aria-hidden="true"></canvas>
<div class="og hero">
  <div class="mark"><svg class="logo" role="img" aria-label="startstartstart!"></svg></div>
  <h1>Your own portfolio site, built by agents.</h1>
  <p><span class="url">startstartstart.app</span> · No coding experience required.</p>
</div>
</body>
</html>
